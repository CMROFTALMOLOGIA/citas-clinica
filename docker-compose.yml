version: "3.8"

services:
  app:
    build: .
    container_name: citas_app
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      - app_data:/app/data
      - ./mailing_credentials.json:/app/mail:ro
      - ./sms_credentials.json:/app/sms:ro
    environment:
      - CLINIC_PIN=${CLINIC_PIN}
      - AFILNET_USER=${AFILNET_USER}
      - AFILNET_PASS=${AFILNET_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: citas_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
